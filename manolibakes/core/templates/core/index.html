{% extends 'core/_base.html' %}
{% load static %}
{% block content %}
  <h1>Pedidos</h1>
  <div class="page-actions">
    <form action="{% url 'core:pedidos' %}">
      <input type="text" class="date-picker" name="date" value="{{ date_iso_str }}" readonly onchange="this.form.submit()" />
    </form>
    <button type="button" class="btn" id="copy-orders-btn">Copiar pedido</button>
  </div>
  <script defer src="{% static 'core/orders_copy.js' %}"></script>
  <table class="table">
    <thead>
      <tr>
        <th class="bread-thumb-cell"></th>
        <th>Tipo de pan</th>
        <th class="col-right">Total</th>
      </tr>
    </thead>
    <tbody>
      {% for order in orders %}
        <tr>
          <td class="bread-thumb-cell">
            {% include "core/_bread_thumb.html" with bread=order %}
          </td>
          <th scope="row"><a href="{% url 'core:pan' bread_id=order.id %}">{{ order.name }}</a></th>
          <td class="col-right">{{ order.number }}</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
